<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preguntas frecuentes — BuenServ</title><style>:root{--ink:#1A1F1D;--green:#0FA37F;--cream:#FAF9F6;--line:#e8e8e2;--muted:#66706b;--mint:#e4f5ee}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:0 32px}a{text-decoration:none;color:inherit}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font:800 24px system-ui;letter-spacing:-1px}.mark{width:29px;height:29px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff}.tools{display:flex;align-items:center;gap:16px}.lang{background:#efefea;border-radius:9px;padding:3px;display:flex;gap:3px}.lang button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:6px 8px;font-size:12px;font-weight:850;cursor:pointer}.lang button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}.back{font-size:13px;color:var(--muted);font-weight:700}main{padding:64px 0 80px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:850}h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.05em}h1{font-size:clamp(42px,6vw,65px);line-height:.98;margin:12px 0 16px}.lead{font-size:18px;color:var(--muted);max-width:630px}.faq-list{margin-top:45px;border-top:1px solid var(--line)}details{border-bottom:1px solid var(--line);padding:20px 0}summary{font-weight:780;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:15px}summary::-webkit-details-marker{display:none}summary:after{content:'+';font-size:22px;color:var(--green)}details[open] summary:after{content:'–'}details p{max-width:700px;color:var(--muted);margin:12px 30px 3px 0}.help{margin-top:42px;border-radius:17px;background:var(--mint);padding:26px}.help h2{font-size:24px;margin:0}.help p{color:#3f685a;margin:7px 0 15px}.btn{display:inline-block;background:var(--green);border-radius:9px;padding:12px 16px;color:white;font-weight:800}@media(max-width:600px){.wrap{padding:0 20px}.back{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script></head><body><header class="wrap"><div class="top"><a class="brand" href="index.html"><span class="mark">b</span>BuenServ</a><div class="tools"><div class="lang"><button class="active" onclick="setLang('es')">ES</button><button onclick="setLang('ru')">RU</button><button onclick="setLang('en')">EN</button></div><a class="back" id="back" href="index.html">← Volver al inicio</a></div></div></header><main class="wrap" id="app"></main><script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script><script>const D={es:{label:'Preguntas frecuentes',title:'Buenas preguntas, respuestas claras.',lead:'Todo lo esencial para empezar a usar BuenServ con confianza.',help:'¿Todavía necesitás ayuda?',helptext:'Escribinos desde Telegram y te acompañamos.',button:'Abrir soporte ↗',qs:[['¿Cómo contacto a un prestador?','Tocá “Contactar” en el perfil y te llevamos al bot de Telegram con la referencia correcta para continuar la conversación.'],['¿Las reseñas son reales?','Las reseñas se vinculan a servicios gestionados a través de BuenServ. Moderamos reportes para cuidar la calidad de la comunidad.'],['¿Qué formas de pago están disponibles?','Cada prestador informa sus opciones. Podés coordinar directamente pagos en pesos, dólares o USDT. BuenServ no ofrece servicios de cambio.'],['¿BuenServ cobra por buscar un servicio?','No. Para quienes buscan un servicio no hay cargos ocultos por explorar perfiles o iniciar una conversación.'],['¿Por qué no veo datos de pago en el perfil?','Por seguridad, nunca publicamos direcciones de billeteras ni información sensible. Cualquier detalle se comparte sólo dentro de una conversación privada y tras la confirmación correspondiente.'],['¿Cómo reporto un problema?','Usá el canal de soporte en Telegram e incluí el perfil y una breve descripción. Nuestro equipo revisará el caso.']]},ru:{label:'Частые вопросы',title:'Хорошие вопросы. Понятные ответы.',lead:'Всё важное, чтобы уверенно начать пользоваться BuenServ.',help:'Остались вопросы?',helptext:'Напишите нам в Telegram — мы поможем.',button:'Открыть поддержку ↗',qs:[['Как связаться с исполнителем?','Нажмите «Связаться» в профиле — мы откроем Telegram-бота с нужной ссылкой, чтобы продолжить разговор.'],['Отзывы настоящие?','Отзывы привязаны к услугам, проведённым через BuenServ. Мы модерируем жалобы, чтобы поддерживать качество сообщества.'],['Какие способы оплаты доступны?','Исполнитель указывает свои варианты. Можно напрямую договориться об оплате в песо, долларах или USDT. BuenServ не предоставляет услуги обмена.'],['Есть ли плата за поиск услуги?','Нет. Для тех, кто ищет услугу, нет скрытых платежей за просмотр профилей или начало разговора.'],['Почему в профиле нет платёжных данных?','В целях безопасности мы никогда не публикуем адреса кошельков и конфиденциальную информацию. Детали передаются только в личном диалоге после необходимого подтверждения.'],['Как сообщить о проблеме?','Напишите в поддержку в Telegram, указав профиль и краткое описание. Наша команда рассмотрит обращение.']]},en:{label:'Frequently asked questions',title:'Good questions. Clear answers.',lead:'Everything you need to start using BuenServ with confidence.',help:'Still need help?',helptext:'Message us in Telegram and we will guide you.',button:'Open support ↗',qs:[['How do I contact a provider?','Tap “Contact” on a profile and we take you to the Telegram bot with the right reference to continue the conversation.'],['Are the reviews real?','Reviews are tied to services managed through BuenServ. We moderate reports to protect the quality of our community.'],['Which payment methods are available?','Each provider lists their options. You can arrange payment in pesos, dollars or USDT directly. BuenServ does not provide exchange services.'],['Does BuenServ charge people looking for a service?','No. There are no hidden fees for exploring profiles or starting a conversation.'],['Why can’t I see payment details on a profile?','For security, wallet addresses and sensitive information are never public. Any detail is shared only in a private conversation after the relevant confirmation.'],['How do I report an issue?','Use the Telegram support channel and include the profile and a brief description. Our team will review it.']]}};function setLang(l){localStorage.buenservLang=l;let x=D[l];document.documentElement.lang=l==='es'?'es-AR':l;document.title='BuenServ — '+x.label;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===l));document.getElementById('back').textContent=l==='es'?'← Volver al inicio':l==='ru'?'← На главную':'← Back to home';document.getElementById('app').innerHTML=`<span class="eyebrow">BuenServ · ${x.label}</span><h1>${x.title}</h1><p class="lead">${x.lead}</p><section class="faq-list">${x.qs.map((q,i)=>`<details ${i===0?'open':''}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</section><section class="help"><h2>${x.help}</h2><p>${x.helptext}</p><a class="btn" href="https://t.me">${x.button}</a></section>`;if(window.anime&&!matchMedia('(prefers-reduced-motion:reduce)').matches)anime({targets:'#app>*',opacity:[0,1],translateY:[12,0],delay:anime.stagger(50),duration:250,easing:'easeOutCubic'})}setLang(localStorage.buenservLang||'es')</script></body></html>
