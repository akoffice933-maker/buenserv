<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuenServ — Cómo funciona</title><style>:root{--g:#0fa37f;--i:#1a1f1d;--m:#66706b;--b:#e8e8e2;--bg:#faf9f6;--mint:#e4f5ee;--t:#e8703a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,system-ui;color:var(--i)}.w{max-width:1060px;margin:auto;padding:0 25px}.top{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}a{text-decoration:none;color:inherit}.brand{font:800 24px system-ui}.brand b{background:var(--g);color:#fff;padding:3px 9px;border-radius:8px;margin-right:7px}.lang{display:flex;padding:3px;gap:3px;background:#eee;border-radius:9px}.lang button{border:0;background:transparent;color:var(--m);padding:6px 8px;border-radius:6px;font-weight:800;cursor:pointer}.lang .on{background:#fff;color:var(--i)}main{padding:70px 0 90px}.ey{color:var(--g);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.05em}h1{font-size:clamp(43px,6vw,68px);line-height:.96;max-width:730px;margin:14px 0 17px}.lead{font-size:18px;color:var(--m);max-width:650px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}.step{background:#fff;border:1px solid var(--b);border-radius:18px;padding:25px;min-height:270px}.num{font:850 13px "Space Grotesk";color:var(--t);margin-bottom:54px}.icon{height:42px;font-size:30px;color:var(--g)}.step h2{font-size:23px;margin:10px 0 5px}.step p{color:var(--m);margin:0}.note{margin-top:46px;border-radius:20px;padding:38px;background:var(--i);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:25px}.note h2{font-size:31px;margin:0}.note p{color:#c1cbc6;max-width:590px}.btn{display:inline-block;background:var(--g);color:#fff;border-radius:9px;padding:13px 17px;font-weight:800;white-space:nowrap}@media(max-width:700px){.w{padding:0 20px}main{padding:48px 0 65px}.steps{grid-template-columns:1fr}.note{display:block;padding:30px 24px}.note .btn{margin-top:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><link rel="stylesheet" href="site-header.css"><script src="site-header.js" defer></script><body><header class="w top"><a class="brand" href="index.html"><b>b</b>BuenServ</a><div class="lang"><button onclick="set('es')">ES</button><button onclick="set('ru')">RU</button><button onclick="set('en')">EN</button></div></header><main class="w"><span class="ey" id="ey"></span><h1 id="h"></h1><p class="lead" id="lead"></p><section class="steps" id="steps"></section><section class="note"><div><h2 id="nh"></h2><p id="np"></p></div><a id="cta" class="btn" href="https://t.me"></a></section></main><script>const T={es:{ey:'BUENSERV · CÓMO FUNCIONA',h:'Menos vueltas. Más soluciones.',lead:'BuenServ te ayuda a encontrar profesionales locales y coordinar cada detalle en el chat que ya usás.',s:[['01','⌕','Buscá','Elegí una categoría, mirá perfiles públicos y encontrá profesionales cerca tuyo.'],['02','◌','Contactá','Tocá el perfil que te interesa y continuá la conversación directamente en Telegram.'],['03','↗','Coordiná','Definí disponibilidad, alcance del trabajo y la forma de pago de manera clara.']],nh:'Tu solución está a un mensaje.',np:'Explorá los perfiles o abrí el bot para contarnos qué necesitás.',cta:'Abrir en Telegram ↗'},ru:{ey:'BUENSERV · КАК ЭТО РАБОТАЕТ',h:'Меньше хлопот. Больше решений.',lead:'BuenServ помогает найти местного специалиста и обсудить детали в чате, которым вы уже пользуетесь.',s:[['01','⌕','Найдите','Выберите категорию, посмотрите открытые профили и специалистов поблизости.'],['02','◌','Свяжитесь','Нажмите на интересующий профиль и продолжите разговор прямо в Telegram.'],['03','↗','Договоритесь','Согласуйте время, объём работы и способ оплаты понятно и напрямую.']],nh:'Ваше решение — в одном сообщении.',np:'Посмотрите профили или откройте бота и расскажите, что вам нужно.',cta:'Открыть в Telegram ↗'},en:{ey:'BUENSERV · HOW IT WORKS',h:'Less friction. More solutions.',lead:'BuenServ helps you find local professionals and coordinate every detail in the chat you already use.',s:[['01','⌕','Search','Choose a category, browse public profiles and find professionals close to you.'],['02','◌','Connect','Tap the profile that interests you and continue the conversation directly in Telegram.'],['03','↗','Arrange','Set availability, the scope of work and the payment method clearly and directly.']],nh:'Your solution is one message away.',np:'Browse profiles or open the bot and tell us what you need.',cta:'Open in Telegram ↗'}};function set(l){localStorage.buenservLang=l;let x=T[l];document.documentElement.lang=l==='es'?'es-AR':l;document.title='BuenServ — '+x.h;ey.textContent=x.ey;h.textContent=x.h;lead.textContent=x.lead;nh.textContent=x.nh;np.textContent=x.np;cta.textContent=x.cta;steps.innerHTML=x.s.map(a=>`<article class="step"><div class="num">${a[0]}</div><div class="icon">${a[1]}</div><h2>${a[2]}</h2><p>${a[3]}</p></article>`).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===l))}set(localStorage.buenservLang||'es')</script></body></html>
