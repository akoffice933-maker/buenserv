<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuenServ — Prestadores</title><style>:root{--g:#0fa37f;--i:#1a1f1d;--m:#66706b;--b:#e8e8e2;--bg:#faf9f6;--mint:#e4f5ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px/1.5 Inter,system-ui}.w{max-width:1180px;margin:auto;padding:0 28px}a{text-decoration:none;color:inherit}.top{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 24px system-ui}.brand b{background:var(--g);color:#fff;padding:3px 9px;border-radius:8px;margin-right:7px}.tools,.lang{display:flex;align-items:center;gap:9px}.lang{padding:3px;background:#eee;border-radius:9px}.lang button{border:0;background:transparent;color:var(--m);padding:6px 8px;border-radius:6px;font-weight:850;cursor:pointer}.lang .on{background:#fff;color:var(--i)}.btn{display:inline-block;border-radius:9px;background:var(--g);color:#fff;padding:13px 17px;font-weight:800}.hero{padding:72px 0;background:linear-gradient(115deg,#eaf8f1,#fff0e7)}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:850;color:var(--g)}h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.05em}h1{font-size:clamp(46px,6vw,74px);line-height:.95;margin:13px 0 18px}.lead{font-size:18px;color:var(--m);max-width:560px}.hero-photo{height:340px;border-radius:22px;background:linear-gradient(#1a1f1d18,#1a1f1d25),url('assets/provider-onboarding.jpg') center/cover;box-shadow:0 14px 35px #17352a22}.benefits{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-bottom:1px solid var(--b)}.benefit{padding:23px;display:flex;gap:11px;font-weight:750;border-right:1px solid var(--b)}.check{color:var(--g);font-size:18px}.section{padding:82px 0}.center{text-align:center;max-width:640px;margin:auto}.center h2,.cta h2{font-size:clamp(31px,4vw,47px);line-height:1;margin:10px 0}.center p{color:var(--m)}.steps{max-width:740px;margin:42px auto 0}.step{display:grid;grid-template-columns:58px 1fr;gap:18px;padding-bottom:27px}.num{width:46px;height:46px;border-radius:50%;background:var(--mint);color:var(--g);display:grid;place-items:center;font-weight:850}.step h3{font-size:21px;margin:3px 0}.step p{color:var(--m);margin:5px 0}.cta{background:var(--i);border-radius:23px;padding:48px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:25px}.cta p{color:#c3ccc7;max-width:570px}@media(max-width:720px){.w{padding:0 20px}.hero{padding:48px 0 58px}.hero-grid,.benefits{grid-template-columns:1fr}.hero-photo{height:230px}.benefit{border-bottom:1px solid var(--b)}.section{padding:62px 0}.cta{display:block;padding:32px 24px}.cta .btn{margin-top:13px}} </style><body><header class="w top"><a class="brand" href="index.html"><b>b</b>BuenServ</a><div class="tools"><div class="lang"><button onclick="set('es')">ES</button><button onclick="set('ru')">RU</button><button onclick="set('en')">EN</button></div><a class="btn" id="topcta" href="https://t.me?start=provider"></a></div></header><main><section class="hero"><div class="w hero-grid"><div><span class="ey" id="ey"></span><h1 id="h"></h1><p class="lead" id="lead"></p><a class="btn" id="herocta" href="https://t.me?start=provider"></a></div><div class="hero-photo"></div></div></section><section class="benefits" id="benefits"></section><section class="section w"><div class="center"><span class="ey" id="stepEy"></span><h2 id="stepH"></h2><p id="stepP"></p></div><div class="steps" id="steps"></div></section><section class="w" style="padding-bottom:80px"><div class="cta"><div><span class="ey" style="color:#8dddc4" id="ctaEy"></span><h2 id="ctaH"></h2><p id="ctaP"></p></div><a class="btn" id="ctaBtn" href="https://t.me?start=provider"></a></div></section></main><script>const T={es:{ey:'BUENSERV · PARA PRESTADORES',h:'Tu trabajo, tus reglas.',lead:'Creá un perfil, llegá a más clientes en Buenos Aires y organizá cada consulta desde Telegram.',join:'Quiero ofrecer servicios ↗',benefits:['Perfil profesional sin costo','0% comisión los primeros 6 meses','Vos organizás tu agenda y tus cobros'],se:'EN CINCO PASOS',sh:'Empezá hoy, sin burocracia.',sp:'El registro se completa en el bot. Podés guardar tu avance y volver cuando quieras.',steps:[['Elegí tu servicio','Contanos qué hacés y en qué barrios trabajás.'],['Completá tu perfil','Sumá una foto, una descripción clara y precios orientativos.'],['Verificá tu información','Revisamos los datos para construir confianza en la comunidad.'],['Recibí consultas','Los clientes te contactan desde Telegram cuando ven tu perfil.'],['Coordiná y crecé','Definí el trabajo y la forma de pago directamente con cada cliente.']],ce:'TU PRÓXIMO CLIENTE ESTÁ CERCA',ch:'Mostrá lo que sabés hacer.',cp:'Sumate gratis a una red local creada para el trabajo independiente.',cb:'Crear mi perfil ↗'},ru:{ey:'BUENSERV · ИСПОЛНИТЕЛЯМ',h:'Ваша работа — ваши правила.',lead:'Создайте профиль, находите больше клиентов в Буэнос-Айресе и управляйте обращениями через Telegram.',join:'Предлагать услуги ↗',benefits:['Бесплатный профессиональный профиль','0% комиссии первые 6 месяцев','Вы управляете графиком и способом оплаты'],se:'ПЯТЬ ШАГОВ',sh:'Начните сегодня, без бюрократии.',sp:'Регистрация проходит в боте. Можно сохранить прогресс и вернуться позже.',steps:[['Выберите услугу','Расскажите, что вы делаете и в каких районах работаете.'],['Заполните профиль','Добавьте фото, понятное описание и ориентировочные цены.'],['Подтвердите информацию','Мы проверяем данные, чтобы поддерживать доверие в сообществе.'],['Получайте обращения','Клиенты связываются с вами через Telegram, увидев профиль.'],['Договаривайтесь и развивайтесь','Определяйте работу и способ оплаты напрямую с каждым клиентом.']],ce:'ВАШ СЛЕДУЮЩИЙ КЛИЕНТ РЯДОМ',ch:'Покажите, что вы умеете.',cp:'Бесплатно присоединяйтесь к локальной сети независимых специалистов.',cb:'Создать профиль ↗'},en:{ey:'BUENSERV · FOR PROVIDERS',h:'Your work, your rules.',lead:'Create a profile, reach more customers in Buenos Aires and organise every enquiry in Telegram.',join:'Offer my services ↗',benefits:['Professional profile at no cost','0% fee for the first 6 months','You manage your schedule and payment method'],se:'IN FIVE STEPS',sh:'Start today, without bureaucracy.',sp:'Registration happens in the bot. Save your progress and return whenever you want.',steps:[['Choose your service','Tell us what you do and which neighbourhoods you serve.'],['Complete your profile','Add a photo, a clear description and indicative prices.'],['Verify your information','We review information to build trust in the community.'],['Receive enquiries','Clients contact you in Telegram after viewing your profile.'],['Arrange and grow','Define the work and payment method directly with each client.']],ce:'YOUR NEXT CUSTOMER IS CLOSE',ch:'Show what you can do.',cp:'Join a local network built for independent professionals, free of charge.',cb:'Create my profile ↗'}};function set(l){localStorage.buenservLang=l;let x=T[l];document.documentElement.lang=l==='es'?'es-AR':l;document.title='BuenServ — '+x.h;[ey,h,lead,topcta,herocta,stepEy,stepH,stepP,ctaEy,ctaH,ctaP,ctaBtn].forEach((e,i)=>e.textContent=[x.ey,x.h,x.lead,x.join,x.join,x.se,x.sh,x.sp,x.ce,x.ch,x.cp,x.cb][i]);benefits.innerHTML=x.benefits.map(v=>`<div class="benefit"><span class="check">✓</span><span>${v}</span></div>`).join('');steps.innerHTML=x.steps.map((v,i)=>`<article class="step"><span class="num">0${i+1}</span><div><h3>${v[0]}</h3><p>${v[1]}</p></div></article>`).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===l))}set(localStorage.buenservLang||'es')</script></body></html>
