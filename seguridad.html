<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguridad — BuenServ</title><style>:root{--ink:#1A1F1D;--green:#0FA37F;--cream:#FAF9F6;--line:#e8e8e2;--muted:#66706b;--mint:#e4f5ee;--terra:#E8703A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:920px;padding:0 32px;margin:auto}a{text-decoration:none;color:inherit}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;font:800 24px system-ui;letter-spacing:-1px}.mark{display:grid;place-items:center;background:var(--green);width:29px;height:29px;border-radius:9px;color:#fff}.tools{display:flex;align-items:center;gap:14px}.lang{display:flex;gap:3px;background:#efefea;padding:3px;border-radius:9px}.lang button{border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}.lang button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}.back{font-size:13px;font-weight:700;color:var(--muted)}main{padding:65px 0 80px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--green)}h1,h2{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.05em}h1{font-size:clamp(41px,6vw,65px);line-height:.98;max-width:720px;margin:13px 0 20px}h2{font-size:25px;margin:0 0 10px}.lead{font-size:18px;max-width:670px}.callout{margin:38px 0;background:var(--mint);border-radius:16px;padding:23px 25px;color:#175e4b;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:42px 0}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px}.num{color:var(--terra);font-weight:850;font-size:13px}.card p{color:var(--muted);margin:8px 0 0}.details{margin-top:45px;padding-top:36px;border-top:1px solid var(--line);max-width:760px}.details p{color:var(--muted)}.cta{margin-top:35px;display:inline-flex;background:var(--green);color:#fff;padding:13px 17px;border-radius:9px;font-weight:800}@media(max-width:600px){.wrap{padding:0 20px}.grid{grid-template-columns:1fr}.back{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><header class="wrap"><div class="top"><a class="brand" href="index.html"><span class="mark">b</span>BuenServ</a><div class="tools"><div class="lang"><button class="active" onclick="setLang('es')">ES</button><button onclick="setLang('ru')">RU</button><button onclick="setLang('en')">EN</button></div><a class="back" href="index.html" id="back">← Volver al inicio</a></div></div></header><main class="wrap" id="content"></main><script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script><script>const C={es:{title:'Tu seguridad importa en cada paso.',lead:'BuenServ ayuda a conectar personas que necesitan un servicio con profesionales locales. Diseñamos la experiencia para que la coordinación sea clara, directa y responsable.',notice:'Importante: BuenServ no muestra direcciones de billeteras ni datos de pago sensibles en perfiles públicos.',items:[['01','Perfiles con contexto','Mostramos servicios, barrio, precios orientativos y reseñas para ayudarte a tomar una decisión informada.'],['02','Contacto en un entorno conocido','La coordinación continúa en Telegram mediante un enlace directo al perfil del prestador.'],['03','Pagos acordados con claridad','Cada persona acuerda la forma de pago directamente. El uso de ARS, USD o USDT se comunica como una opción de coordinación, no como servicio de cambio.'],['04','Ayuda cuando la necesitás','Podés reportar un perfil o consultar a soporte si algo no se ve bien.']],detail:'Recomendamos revisar reseñas, confirmar el alcance y el precio antes de contratar. No compartas contraseñas, códigos de verificación ni información bancaria sensible. Las direcciones de billetera, si fueran necesarias para una operación acordada, se comparten únicamente dentro de la conversación privada y después de la confirmación correspondiente.',cta:'Abrir soporte en Telegram ↗'},ru:{title:'Ваша безопасность важна на каждом шаге.',lead:'BuenServ помогает связать людей, которым нужна услуга, с местными специалистами. Мы проектируем сервис так, чтобы договорённости были понятными, прямыми и ответственными.',notice:'Важно: BuenServ не показывает адреса кошельков и платёжные данные в публичных профилях.',items:[['01','Профили с нужным контекстом','Мы показываем услуги, район, ориентировочные цены и отзывы — чтобы решение было взвешенным.'],['02','Связь в привычной среде','Договорённость продолжается в Telegram через прямую ссылку на профиль исполнителя.'],['03','Понятные договорённости об оплате','Способ оплаты стороны определяют напрямую. ARS, USD или USDT обозначаются как варианты договорённости, а не сервис обмена.'],['04','Помощь, когда она нужна','Вы можете пожаловаться на профиль или написать в поддержку, если что-то выглядит неправильно.']],detail:'Советуем проверять отзывы, заранее подтверждать объём работы и цену. Не сообщайте пароли, коды подтверждения и чувствительные банковские данные. Адреса кошельков, если они нужны в рамках согласованной сделки, передаются только в приватном диалоге после соответствующего подтверждения.',cta:'Открыть поддержку в Telegram ↗'},en:{title:'Your safety matters at every step.',lead:'BuenServ helps people looking for a service connect with local professionals. We design the experience to keep coordination clear, direct and responsible.',notice:'Important: BuenServ never displays wallet addresses or sensitive payment data on public profiles.',items:[['01','Profiles with context','We show services, neighbourhood, indicative prices and reviews to help you make an informed choice.'],['02','Contact in a familiar space','Coordination continues in Telegram through a direct link to the provider profile.'],['03','Payment arrangements made clearly','Each person agrees on payment directly. ARS, USD or USDT are presented as coordination options, not as an exchange service.'],['04','Help when you need it','You can report a profile or contact support if something does not look right.']],detail:'We recommend checking reviews and confirming the scope and price before hiring. Never share passwords, verification codes or sensitive banking information. Wallet addresses, if needed for an agreed transaction, are shared only in a private conversation after the appropriate confirmation.',cta:'Open support in Telegram ↗'}};function setLang(l){localStorage.buenservLang=l;let x=C[l];document.documentElement.lang=l==='es'?'es-AR':l;document.title='BuenServ — '+x.title;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===l));document.getElementById('back').textContent=l==='es'?'← Volver al inicio':l==='ru'?'← На главную':'← Back to home';let cards=x.items.map(i=>`<article class="card"><span class="num">${i[0]}</span><h2>${i[1]}</h2><p>${i[2]}</p></article>`).join('');document.getElementById('content').innerHTML=`<span class="eyebrow">BuenServ · ${l==='es'?'Seguridad':l==='ru'?'Безопасность':'Safety'}</span><h1>${x.title}</h1><p class="lead">${x.lead}</p><div class="callout">${x.notice}</div><section class="grid">${cards}</section><article class="details"><h2>${l==='es'?'Consejos para una experiencia segura':l==='ru'?'Советы для безопасного опыта':'Tips for a safe experience'}</h2><p>${x.detail}</p><a class="cta" href="https://t.me">${x.cta}</a></article>`;if(window.anime&&!matchMedia('(prefers-reduced-motion:reduce)').matches)anime({targets:'#content>*',opacity:[0,1],translateY:[12,0],delay:anime.stagger(45),duration:250,easing:'easeOutCubic'})}setLang(localStorage.buenservLang||'es')</script></body></html>
