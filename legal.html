ru')">RU</button><button onclick="setLang('en')">EN</button></div><a class="back" id="back" href="index.html">← Volver</a></div></header><main class="w"><span class="ey">BuenServ · Legal</span><nav class="tabs" id="tabs"></nav><article id="doc"></article></main><script>const D={es:{back:'← Volver al inicio',terms:'Términos de uso',privacy:'Privacidad',cookies:'Cookies',updated:'Última actualización: 06/08/2026',data:{terms:{h:'Términos de uso',s:[['1. Alcance del servicio','BuenServ es una plataforma de descubrimiento y conexión entre personas que buscan servicios y prestadores independientes en Buenos Aires. BuenServ no es parte del contrato de servicio entre cliente y prestador.'],['2. Perfiles y contenido','Los prestadores son responsables de la exactitud de su perfil, precios orientativos, disponibilidad y contenido publicado. BuenServ puede moderar, corregir, suspender o eliminar contenido que incumpla las reglas.'],['3. Pagos y acuerdos','Cliente y prestador acuerdan directamente el alcance, precio y forma de pago. BuenServ no custodia fondos, no opera un exchange y no muestra direcciones de billeteras ni datos de pago sensibles en perfiles públicos.'],['4. Reseñas y denuncias','Las reseñas deben reflejar experiencias reales. Las denuncias se revisan según las políticas de seguridad y moderación.'],['5. Cambios','Podemos actualizar estos términos; la fecha de actualización será visible en esta página.']]},privacy:{h:'Política de privacidad',s:[['1. Datos que tratamos','Podemos tratar datos de perfil, contacto, uso del sitio, interacciones con el bot, consultas de soporte y datos necesarios para moderación.'],['2. Finalidad','Usamos los datos para operar BuenServ, mostrar perfiles, responder solicitudes, prevenir abuso, mejorar el servicio y cumplir obligaciones legales.'],['3. Compartición','No vendemos datos personales. Compartimos la información mínima necesaria entre cliente y prestador cuando una persona inicia una conversación o solicitud.'],['4. Seguridad y conservación','Aplicamos medidas razonables de seguridad y conservamos los datos el tiempo necesario para la finalidad correspondiente y obligaciones aplicables.'],['5. Tus derechos','Podés solicitar acceso, corrección o eliminación de datos mediante el canal de contacto de BuenServ.']]},cookies:{h:'Política de cookies',s:[['1. Cookies necesarias','Usamos almacenamiento local y tecnologías necesarias para recordar preferencias de idioma y asegurar el funcionamiento básico.'],['2. Analítica','Podemos usar analítica agregada para comprender cómo se usan las páginas y mejorar la experiencia.'],['3. Control','Podés limitar cookies desde tu navegador. Algunas funciones, como la preferencia de idioma, pueden verse afectadas.']]}}},ru:{back:'← На главную',terms:'Условия',privacy:'Конфиденциальность',cookies:'Cookie',updated:'Обновлено: 06.08.2026',data:{terms:{h:'Условия использования',s:[['1. Сфера сервиса','BuenServ — платформа для поиска и связи между людьми, которым нужны услуги, и независимыми исполнителями в Буэнос-Айресе. BuenServ не является стороной договора между клиентом и исполнителем.'],['2. Профили и контент','Исполнитель отвечает за точность профиля, ориентировочных цен, доступности и опубликованного контента. BuenServ может модерировать, исправлять, приостанавливать или удалять контент, нарушающий правила.'],['3. Оплата и договорённости','Клиент и исполнитель напрямую согласуют объём, цену и способ оплаты. BuenServ не хранит средства, не является обменным сервисом и не показывает адреса кошельков или чувствительные платёжные данные в открытых профилях.'],['4. Отзывы и жалобы','Отзывы должны описывать реальный опыт. Жалобы рассматриваются в соответствии с правилами безопасности и модерации.'],['5. Изменения','Мы можем обновлять условия; дата обновления будет показана на этой странице.']]},privacy:{h:'Политика конфиденциальности',s:[['1. Какие данные обрабатываются','Мы можем обрабатывать данные профиля, контакты, использование сайта, взаимодействия с ботом, обращения в поддержку и данные, необходимые для модерации.'],['2. Цели','Данные используются для работы BuenServ, отображения профилей, ответа на обращения, предотвращения злоупотреблений, улучшения сервиса и выполнения применимых обязательств.'],['3. Передача','Мы не продаём персональные данные. Минимально необходимая информация передаётся между клиентом и исполнителем при начале разговора или запроса.'],['4. Безопасность и хранение','Мы применяем разумные меры безопасности и храним данные столько, сколько нужно для соответствующей цели и применимых обязательств.'],['5. Ваши права','Вы можете запросить доступ, исправление или удаление данных через канал связи BuenServ.']]},cookies:{h:'Политика cookie',s:[['1. Необходимые cookie','Мы используем local storage и необходимые технологии, чтобы сохранять язык и обеспечивать базовую работу сайта.'],['2. Аналитика','Мы можем использовать агрегированную аналитику, чтобы понимать использование страниц и улучшать опыт.'],['3. Контроль','Вы можете ограничить cookie в браузере. Это может повлиять на отдельные функции, например сохранение языка.']]}}},en:{back:'← Back to home',terms:'Terms of use',privacy:'Privacy',cookies:'Cookies',updated:'Last updated: 06/08/2026',data:{terms:{h:'Terms of use',s:[['1. Service scope','BuenServ is a discovery and connection platform for people seeking services and independent providers in Buenos Aires. BuenServ is not a party to the service contract between client and provider.'],['2. Profiles and content','Providers are responsible for the accuracy of their profile, indicative prices, availability and published content. BuenServ may moderate, correct, suspend or remove content that breaches the rules.'],['3. Payments and arrangements','Client and provider agree directly on the scope, price and payment method. BuenServ does not hold funds, operate an exchange, or display wallet addresses or sensitive payment data on public profiles.'],['4. Reviews and reports','Reviews must reflect real experiences. Reports are reviewed under the safety and moderation policies.'],['5. Changes','We may update these terms; the updated date will be visible on this page.']]},privacy:{h:'Privacy policy',s:[['1. Data we process','We may process profile data, contact details, site use, bot interactions, support requests and information needed for moderation.'],['2. Purpose','We use data to operate BuenServ, display profiles, respond to requests, prevent abuse, improve the service and meet applicable obligations.'],['3. Sharing','We do not sell personal data. We share the minimum required information between a client and provider when someone starts a conversation or request.'],['4. Security and retention','We apply reasonable security measures and retain data for the time needed for the relevant purpose and applicable obligations.'],['5. Your rights','You can request access, correction or deletion of data through BuenServ contact channels.']]},cookies:{h:'Cookie policy',s:[['1. Necessary cookies','We use local storage and necessary technologies to remember language preferences and ensure basic functionality.'],['2. Analytics','We may use aggregated analytics to understand page use and improve the experience.'],['3. Control','You can limit cookies in your browser. This may affect features such as saving a language preference.']]}}}};let key=new URLSearchParams(location.search).get('doc')||'terms';function render(){let l=localStorage.buenservLang||'es',x=D[l],o=x.data[key];document.documentElement.lang=l==='es'?'es-AR':l;document.title='BuenServ — '+o.h;back.textContent=x.back;tabs.innerHTML=['terms','privacy','cookies'].map(k=>`<a class="tab ${k===key?'active':''}" href="?doc=${k}">${x[k]}</a>`).join('');doc.innerHTML=`<h1>${o.h}</h1><p class="updated">${x.updated}</p>${o.s.map(a=>`<section><h2>${a[0]}</h2><p class="copy">${a[1]}</p></section>`).join('')}`;function setLang(l){localStorage.buenservLang=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===l));render()}render();setLang(localStorage.buenservLang||'es')</script></body></html>
